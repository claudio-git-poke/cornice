<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Pokémon Antica - Unown</title>
    <style>
        /* Schermo intero e sfondo suggestivo */
        body {
            background: radial-gradient(circle at center, #2b231d 0%, #120e0b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Contenitore principale della carta */
        .pokemon-card {
            width: 380px;
            height: 532px;
            background: 
                radial-gradient(circle at center, rgba(245, 230, 205, 0.9) 0%, rgba(196, 164, 124, 0.95) 100%);
            border-radius: 20px;
            border: 14px solid #5c3d29; 
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(70, 45, 25, 0.7),
                inset 0 0 10px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Area interna della carta */
        .card-inner-frame {
            background: linear-gradient(135deg, #e6d3b3 0%, #cfb58c 100%);
            border: 4px solid #8c6b48;
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
            z-index: 1;
            position: relative;
        }

        /* --- Area del Titolo in stile Unown --- */
        .title-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 72%;
            height: 52px;
            background: linear-gradient(to bottom, #4d3825, #2a1f15);
            border: 3px solid #1a130d;
            border-radius: 10px 10px 30px 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 
                        2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 12px;
            box-sizing: border-box;
        }

        /* Stile grafico ispirato ai simboli Unown (lettere cerchiate/arcaiche) */
        .unown-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            color: #d1b280;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9),
                         0 0 5px rgba(209, 178, 128, 0.4);
        }
    </style>
</head>
<body>

    <div class="pokemon-card">
        <div class="card-inner-frame">
            
            <!-- Contenitore del Titolo -->
            <div class="title-container">
                <span class="unown-title">ⓃⓄⓂⒺ ⓅⓄⓀÉⓂⓄⓃ</span>
            </div>
            
        </div>
    </div>

</body>
</html>
