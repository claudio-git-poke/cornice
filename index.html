<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Pokémon Unown</title>
    <style>
        /* Resetta margini e imposta lo sfondo scuro a schermo intero */
        body {
            background: radial-gradient(circle at center, #2b231d 0%, #120e0b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Contenitore principale della carta */
        .pokemon-card {
            width: 380px;
            height: 532px;
            /* Texture carta pergamena invecchiata */
            background: 
                radial-gradient(circle at center, rgba(245, 230, 205, 0.9) 0%, rgba(196, 164, 124, 0.95) 100%),
                url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36z8gAFkNfwxhgzPUPEGZYgFAGEGEAuhEQEre1f/oAAAAASUVORK5CYII=') repeat;
            border-radius: 20px;
            /* Bordo spesso e arrugginito */
            border: 14px solid #5c3d29; 
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8), /* Ombra esterna */
                inset 0 0 30px rgba(70, 45, 25, 0.7), /* Ombra interna */
                inset 0 0 10px rgba(0, 0, 0, 0.9); /* Scurimento angoli */
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Effetto di usura e bordo irregolare */
        .pokemon-card::before {
            content: "";
            position: absolute;
            top: -14px; left: -14px; right: -14px; bottom: -14px;
            border: 2px solid #3d2817;
            border-radius: 22px;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Area interna della carta */
        .card-inner-frame {
            background: linear-gradient(135deg, #e6d3b3 0%, #cfb58c 100%);
            border: 4px solid #8c6b48; /* Cornice interna */
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
            z-index: 1;
            position: relative;
        }

        /* --- Area del Titolo (Con glifi Unown) --- */
        .title-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 70%;
            height: 55px;
            
            /* Stile della placca del titolo (come nell'immagine) */
            background: linear-gradient(to bottom, #4d3825, #2a1f15);
            border: 4px solid #1a130d;
            border-radius: 12px 12px 35px 12px; /* Angolo inferiore destro arrotondato */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 
                        2px 2px 4px rgba(0,0,0,0.5);
            
            /* Centrare l'immagine dei glifi */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            box-sizing: border-box;
        }
