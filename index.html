<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Dinamica</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1.35;
            
            /* Usa la tua carta.png originale */
            background-image: url('./carta.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Questo box riempie il "buco" trasparente con il colore della pergamena e ci mette il testo sopra */
        .card-inner-box {
            position: absolute;
            top: 13.8%;   
            left: 17%;  
            width: 66%; 
            height: 50.5%; 
            
            /* Colore di sfondo che simula la pergamena per tappare il buco */
            background-color: #d2c2a6;
            
            color: #2b1d0c;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-inner-box h2 {
            font-size: 1.2rem;
            margin: 0 0 8px 0;
        }

        .card-inner-box p {
            font-size: 0.85rem;
            margin: 0;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-inner-box">
        <h2>Titolo Carta</h2>
        <p>Il buco ora è chiuso dal CSS e il testo è perfettamente al centro della cornice!</p>
    </div>
</div>

</body>
</html>
