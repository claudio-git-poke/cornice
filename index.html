<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Dinamica</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card-container {
            position: relative;
            /* Usiamo le dimensioni reali o adattive basate sull'immagine */
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1.4; /* Mantiene proporzioni perfette da carta */
            
            background-image: url('./carta.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        /* Area interna posizionata esattamente nel buco centrale */
        .card-inner-box {
            position: absolute;
            /* Percentuali così si adatta perfettamente a qualsiasi schermo */
            top: 13.5%;   
            left: 15.5%;  
            width: 69%; 
            height: 52%; 
            
            padding: 10px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.15); /* Sfondo leggero opzionale */
            color: #2b1d0c;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-inner-box h2 {
            font-size: 1.2rem;
            margin: 0 0 8px 0;
        }

        .card-inner-box p {
            font-size: 0.9rem;
            margin: 0;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-inner-box">
        <h2>Titolo Carta</h2>
        <p>Qui puoi inserire la descrizione, le statistiche o un'altra immagine. Ora è perfettamente dentro la cornice!</p>
    </div>
</div>

</body>
</html>
