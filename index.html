<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Dinamica</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card-container {
            position: relative;
            width: 400px;
            height: 560px;
            /* Percorso dell'immagine di sfondo */
            background-image: url('./carta.png');
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        /* Area rettangolare centrale editabile per il testo o le immagini */
        .card-inner-box {
            position: absolute;
            top: 75px;   
            left: 65px;  
            width: 270px; 
            height: 285px; 
            
            padding: 15px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.15); /* Sfondo leggero per leggibilità */
            color: #2b1d0c;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-inner-box h2 {
            font-size: 22px;
            margin: 0 0 10px 0;
        }

        .card-inner-box p {
            font-size: 14px;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-inner-box">
        <h2>Titolo Carta</h2>
        <p>Qui puoi inserire la descrizione, le statistiche o un'altra immagine. È facilissimo da modificare!</p>
    </div>
</div>

</body>
</html>
