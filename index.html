<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Pokémon - Struttura Pura</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* 1. IL CONTENITORE DELLA CARTA (Misura standard Pokémon 63mm x 88mm) */
        .pokemon-card {
            position: relative;
            width: 750px;        
            height: 1049px;      
            border-radius: 40px; 
            
            /* 2. L'IMMAGINE DI SFONDO (La tua carta.png originale con i buchi) */
            background-image: url('./carta.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 3. AREA IMMAGINE CENTRALE (Visibile attraverso il buco) */
        .card-image-area {
            position: absolute;
            top: 13.5%;      
            left: 14.8%;
            width: 70.5%;    
            height: 51.5%;   
            
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .card-image-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 4. AREA NOME DELLA CARTA (Sotto) */
        .card-name-area {
            position: absolute;
            top: 66.5%;      
            left: 25%;
            width: 50%;      
            height: 5%;      
            
            background-color: transparent;
            color: #2b1d0c;  
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .card-name-area h1 {
            font-size: 32px; 
            margin: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="pokemon-card">
    
    <!-- Spazio per l'immagine centrale (puoi cambiare il link con la tua illustrazione) -->
    <div class="card-image-area">
        <img src="https://images.unsplash.com/photo-1563089145-599997674d42?w=600" alt="Illustrazione">
    </div>

    <!-- Spazio per il nome editabile -->
    <div class="card-name-area">
        <h1>NOME CARTA</h1>
    </div>

</div>

</body>
</html>
