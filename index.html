<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Pokémon Antica - Unown</title>
    <style>
        /* Schermo intero e sfondo suggestivo */
        body {
            background: radial-gradient(circle at center, #2b231d 0%, #120e0b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Contenitore principale della carta */
        .pokemon-card {
            width: 380px;
            height: 532px;
            background: 
                radial-gradient(circle at center, rgba(245, 230, 205, 0.9) 0%, rgba(196, 164, 124, 0.95) 100%);
            border-radius: 20px;
            border: 14px solid #5c3d29; 
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(70, 45, 25, 0.7),
                inset 0 0 10px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Area interna della carta */
        .card-inner-frame {
            background: linear-gradient(135deg, #e6d3b3 0%, #cfb58c 100%);
            border: 4px solid #8c6b48;
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
            z-index: 1;
            position: relative;
        }

        /* --- Area del Titolo (Targhetta antica) --- */
        .title-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 78%;
            height: 56px;
            background: linear-gradient(to bottom, #4d3825, #2a1f15);
            border: 3px solid #1a130d;
            border-radius: 10px 10px 30px 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 
                        2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            box-sizing: border-box;
            z-index: 2;
        }

        .unown-svg-title {
            width: 100%;
            height: 42px;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.9));
        }

        /* --- Area Rossa: Immagine Pokémon (Placeholder) --- */
        .card-image-box {
            position: absolute;
            top: 82px;
            left: 12px;
            right: 12px;
            height: 245px;
            background: linear-gradient(135deg, #2b231d 0%, #1a130d 100%);
            border: 4px solid #5c3d29;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8),
                        0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-image-box span {
            color: #8c6b48;
            font-family: 'Georgia', serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            padding: 10px;
        }

        /* --- Area Verde: Testo Descrittivo --- */
        .card-description-box {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            height: 110px;
            background: linear-gradient(to bottom, #f4e8d1, #dcc4a0);
            border: 3px solid #7a5c3e;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(122, 92, 62, 0.3),
                        0 2px 4px rgba(0,0,0,0.2);
            padding: 10px 12px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-description-text {
            font-family: 'Georgia', serif;
            font-size: 12px;
            color: #3d2817;
            text-align: center;
            line-height: 1.4;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="pokemon-card">
        <div class="card-inner-frame">
            
            <div class="title-container">
                <svg class="unown-svg-title" viewBox="0 0 280 45" xmlns="http://www.w3.org/2000/svg">
                    <g fill="none" stroke="#d1b280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        
                        <g transform="translate(10, 5)">
                            <path d="M4 28 L4 12 L16 24 L16 8"/>
                            <circle cx="10" cy="18" r="4" fill="#d1b280"/>
                        </g>

                        <g transform="translate(38, 5)">
                            <circle cx="10" cy="18" r="9"/>
                            <circle cx="10" cy="18" r="3" fill="#d1b280"/>
                        </g>

                        <g transform="translate(66, 5)">
                            <path d="M3 28 L3 12 L9 20 L15 12 L15 28"/>
                            <circle cx="9" cy="17" r="3.5" fill="#d1b280"/>
                        </g>

                        <g transform="translate(94, 5)">
                            <path d="M14 28 L4 28 L4 8 L14 8"/>
                            <path d="M4 18 L11 18"/>
                            <circle cx="9" cy="18" r="3.5" fill="#d1b280"/>
                        </g>

                        <g transform="translate(132, 5)">
                            <circle cx="10" cy="14" r="8"/>
                            <path d="M10 22 L10 30"/>
                            <circle cx="10" cy="14" r="3" fill="#d1b280"/>
                        </g>

                        <g transform="translate(160, 5)">
                            <circle cx="10" cy="18" r="9"/>
                            <circle cx="10" cy="18" r="3" fill="#d1b280"/>
                        </g>

                        <g transform="translate(188, 5)">
                            <path d="M10 8 L10 28"/>
                            <path d="M4 12 L14 22"/>
                            <path d="M4 24 L14 14"/>
                            <circle cx="10" cy="18" r="3" fill="#d1b280"/>
                        </g>

                        <g transform="translate(216, 5)">
                            <path d="M14 28 L4 28 L4 8 L14 8"/>
                            <path d="M4 18 L11 18"/>
                            <path d="M7 3 L11 5"/>
                            <circle cx="9" cy="18" r="3.5" fill="#d1b280"/>
                        </g>

                        <g transform="translate(244, 5)">
                            <path d="M3 28 L3 12 L9 20 L15 12 L15 28"/>
                            <circle cx="9" cy="17" r="3.5" fill="#d1b280"/>
                        </g>

                    </g>
                </svg>
            </div>
            
            <div class="card-image-box">
                <span>[ Inserisci qui la tua immagine ]</span>
            </div>

            <div class="card-description-box">
                <p class="card-description-text">
                    "Ritrovata tra le rovine di un tempio dimenticato. Emana una strana energia primordiale ogni volta che viene estratta dal mazzo."
                </p>
            </div>
            
        </div>
    </div>

</body>
</html>
