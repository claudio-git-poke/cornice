<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Pokémon Antica - Effetti Lusso</title>
    <style>
        body {
            background: radial-gradient(circle at center, #2b231d 0%, #120e0b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Menu fluttuante per testare le rarità */
        .rarity-controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 20, 15, 0.85);
            padding: 8px 15px;
            border-radius: 30px;
            border: 2px solid #5c3d29;
            display: flex;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .rarity-btn {
            background: #4d3825;
            color: #d1b280;
            border: 1px solid #7a5c3e;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Georgia', serif;
            transition: all 0.2s ease;
        }

        .rarity-btn:hover {
            background: #7a5c3e;
            color: #fff;
        }

        /* Contenitore principale della carta */
        .pokemon-card {
            width: 380px;
            height: 532px;
            background: radial-gradient(circle at center, rgba(245, 230, 205, 0.9) 0%, rgba(196, 164, 124, 0.95) 100%);
            border-radius: 20px;
            border: 14px solid #5c3d29; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(70, 45, 25, 0.7);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* --- STILI PER RARITÀ --- */

        /* 1. Comune: Grigio chiaro */
        .pokemon-card.comune {
            background: radial-gradient(circle at center, #dcdcdc 0%, #b5b5b5 100%);
            border-color: #737373;
        }
        .pokemon-card.comune .card-inner-frame {
            background: linear-gradient(135deg, #eaeaea 0%, #cccccc 100%);
            border-color: #8c8c8c;
        }

        /* 2. Non Comune: Grigio scuro */
        .pokemon-card.non-comune {
            background: radial-gradient(circle at center, #595959 0%, #383838 100%);
            border-color: #1a1a1a;
        }
        .pokemon-card.non-comune .card-inner-frame {
            background: linear-gradient(135deg, #4a4a4a 100%, #2e2e2e 0%);
            border-color: #141414;
        }
        .pokemon-card.non-comune .card-description-text { color: #d9d9d9; }

        /* 3. Rara: Grigio quasi nero */
        .pokemon-card.rara {
            background: radial-gradient(circle at center, #222222 0%, #0d0d0d 100%);
            border-color: #050505;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.95), inset 0 0 25px rgba(0, 0, 0, 0.9);
        }
        .pokemon-card.rara .card-inner-frame {
            background: linear-gradient(135deg, #171717 0%, #080808 100%);
            border-color: #262626;
        }
        .pokemon-card.rara .card-description-text { color: #cccccc; }

        /* 4. Ultra Rara: Arcobaleno cangiante super wow in movimento (Foil Olografico) */
        .pokemon-card.ultra-rara {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 400% 400%;
            animation: rainbowFoil 8s ease infinite;
            border-color: #fff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), inset 0 0 35px rgba(255, 255, 255, 0.6);
        }
        .pokemon-card.ultra-rara .card-inner-frame {
            background: rgba(20, 20, 20, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
        }
        .pokemon-card.ultra-rara .card-description-text { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
        
        @keyframes rainbowFoil {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Overlay brillantini scorrevoli per Ultra Rara */
        .pokemon-card.ultra-rara::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(0deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(30deg);
            animation: shineOverlay 3s linear infinite;
            pointer-events: none;
        }
        @keyframes shineOverlay {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        /* 5. Leggendaria: Dorata con animazioni di scintillio che vanno e vengono */
        .pokemon-card.leggendaria {
            background: radial-gradient(circle at center, #fff2b2 0%, #d4af37 60%, #856508 100%);
            border-color: #3b2c02;
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.7), inset 0 0 30px rgba(255, 240, 150, 0.8);
            animation: goldPulse 4s ease-in-out infinite;
        }
        .pokemon-card.leggendaria .card-inner-frame {
            background: linear-gradient(135deg, #fff7d1 0%, #c29b27 100%);
            border-color: #5c4303;
        }
        .pokemon-card.leggendaria .card-description-text { color: #2e2202; }

        @keyframes goldPulse {
            0%, 100% { box-shadow: 0 20px 30px rgba(212, 175, 55, 0.5), inset 0 0 20px rgba(255, 240, 150, 0.5); }
            50% { box-shadow: 0 20px 60px rgba(255, 215, 0, 0.9), inset 0 0 40px rgba(255, 255, 200, 0.9); }
        }

        /* Scintille intermittenti per Leggendaria */
        .sparkle-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }
        .sparkle {
            position: absolute;
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffeb3b, 0 0 20px #ffc107;
            opacity: 0;
            animation: sparkleAnim 2.5s ease-in-out infinite;
        }
        .sparkle:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 75%; left: 80%; animation-delay: 0.8s; }
        .sparkle:nth-child(3) { top: 40%; left: 85%; animation-delay: 1.5s; }
        .sparkle:nth-child(4) { top: 80%; left: 25%; animation-delay: 0.4s; }

        @keyframes sparkleAnim {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.4); opacity: 1; }
        }


        /* Area interna della carta */
        .card-inner-frame {
            background: linear-gradient(135deg, #e6d3b3 0%, #cfb58c 100%);
            border: 4px solid #8c6b48;
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
            z-index: 2;
            position: relative;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        /* Titolo */
        .title-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 78%;
            height: 56px;
            background: linear-gradient(to bottom, #4d3825, #2a1f15);
            border: 3px solid #1a130d;
            border-radius: 10px 10px 30px 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            box-sizing: border-box;
            z-index: 3;
        }

        .unown-svg-title {
            width: 100%;
            height: 42px;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.9));
        }

        /* Immagine */
        .card-image-box {
            position: absolute;
            top: 82px;
            left: 12px;
            right: 12px;
            height: 245px;
            background: linear-gradient(135deg, #2b231d 0%, #1a130d 100%);
            border: 4px solid #5c3d29;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-image-box span {
            color: #8c6b48;
            font-family: 'Georgia', serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            padding: 10px;
        }

        /* Testo */
        .card-description-box {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            height: 110px;
            background: rgba(0, 0, 0, 0.15);
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-description-text {
            font-family: 'Georgia', serif;
            font-size: 12px;
            color: #3d2817;
            text-align: center;
            line-height: 1.4;
            font-style: italic;
            transition: color 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- Menu con i pulsanti per cambiare rarità -->
    <div class="rarity-controls">
        <button class="rarity-btn" onclick="setRarity('comune')">Comune</button>
        <button class="rarity-btn" onclick="setRarity('non-comune')">Non Comune</button>
        <button class="rarity-btn" onclick="setRarity('rara')">Rara</button>
        <button class="rarity-btn" onclick="setRarity('ultra-rara')">Ultra Rara</button>
        <button class="rarity-btn" onclick="setRarity('leggendaria')">Leggendaria</button>
    </div>

    <!-- Carta Pokémon -->
    <div class="pokemon-card comune" id="pokemonCard">
        <!-- Contenitore scintille (visibile solo se leggendaria o attivato) -->
        <div class="sparkle-container" id="sparkleBox">
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
        </div>

        <div class="card-inner-frame">
            <!-- Titolo Unown -->
            <div class="title-container">
                <svg class="unown-svg-title" viewBox="0 0 280 45" xmlns="http://www.w3.org/2000/svg">
                    <g fill="none" stroke="#d1b280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <g transform="translate(10, 5)"><path d="M4 28 L4 12 L16 24 L16 8"/><circle cx="10" cy="18" r="4" fill="#d1b280"/></g>
                        <g transform="translate(38, 5)"><circle cx="10" cy="18" r="9"/><circle cx="10" cy="18" r="3" fill="#d1b280"/></g>
                        <g transform="translate(66, 5)"><path d="M3 28 L3 12 L9 20 L15 12 L15 28"/><circle cx="9" cy="17" r="3.5" fill="#d1b280"/></g>
                        <g transform="translate(94, 5)"><path d="M14 28 L4 28 L4 8 L14 8"/><path d="M4 18 L11 18"/><circle cx="9" cy="18" r="3.5" fill="#d1b280"/></g>
                        <g transform="translate(132, 5)"><circle cx="10" cy="14" r="8"/><path d="M10 22 L10 30"/><circle cx="10" cy="14" r="3" fill="#d1b280"/></g>
                        <g transform="translate(160, 5)"><circle cx="10" cy="18" r="9"/><circle cx="10" cy="18" r="3" fill="#d1b280"/></g>
                        <g transform="translate(188, 5)"><path d="M10 8 L10 28"/><path d="M4 12 L14 22"/><path d="M4 24 L14 14"/><circle cx="10" cy="18" r="3" fill="#d1b280"/></g>
                        <g transform="translate(216, 5)"><path d="M14 28 L4 28 L4 8 L14 8"/><path d="M4 18 L11 18"/><path d="M7 3 L11 5"/><circle cx="9" cy="18" r="3.5" fill="#d1b280"/></g>
                        <g transform="translate(244, 5)"><path d="M3 28 L3 12 L9 20 L15 12 L15 28"/><circle cx="9" cy="17" r="3.5" fill="#d1b280"/></g>
                    </g>
                </svg>
            </div>
            
            <!-- Immagine (Placeholder) -->
            <div class="card-image-box">
                <span>[ Inserisci qui la tua immagine ]</span>
            </div>

            <!-- Testo Descrittivo -->
            <div class="card-description-box">
                <p class="card-description-text" id="descText">
                    "Carta Comune: Un reperto piuttosto comune tra la polvere."
                </p>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        function setRarity(rarityClass) {
            const card = document.getElementById('pokemonCard');
            const descText = document.getElementById('descText');
            const sparkleBox = document.getElementById('sparkleBox');
            
            card.className = 'pokemon-card ' + rarityClass;
            
            // Attiva le scintille solo se è leggendaria
            if(rarityClass === 'leggendaria') {
                sparkleBox.style.display = 'block';
            } else {
                sparkleBox.style.display = 'none';
            }

            switch(rarityClass) {
                case 'comune':
                    descText.innerText = '"Carta Comune: Semplice grigio chiaro, un reperto comune e basilare."';
                    break;
                case 'non-comune':
                    descText.innerText = '"Carta Non Comune: Grigio scuro, leggermente più resistente e difficile da trovare."';
                    break;
                case 'rara':
                    descText.innerText = '"Carta Rara: Grigio quasi nero, cupo e misterioso."';
                    break;
                case 'ultra-rara':
                    descText.innerText = '"Carta Ultra Rara: Foil arcobaleno cangiante in movimento, puro spettacolo visivo!"';
                    break;
                case 'leggendaria':
                    descText.innerText = '"Carta Leggendaria: Dorata, baciata dal sole con bagliori e scintille che vanno e vengono."';
                    break;
            }
        }
        
        // Imposta lo stato iniziale delle scintille su comune (spente)
        document.getElementById('sparkleBox').style.display = 'none';
    </script>

</body>
</html>
