<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Dinamica</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1.35;
            
            background-image: url('./carta.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .card-inner-box {
            position: absolute;
            /* Valori finali millimetrici */
            top: 18.5%;   
            left: 17%;  
            width: 66%; 
            height: 44%; 
            
            background-color: #d2c2a6; /* Colore pergamena */
            
            color: #2b1d0c;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-inner-box h2 {
            font-size: 1.1rem;
            margin: 0 0 6px 0;
        }

        .card-inner-box p {
            font-size: 0.8rem;
            margin: 0;
            line-height: 1.2;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card-inner-box">
        <h2>Titolo Carta</h2>
        <p>Fatto! Adesso il riempimento si adatta esattamente alla finestra della cornice.</p>
    </div>
</div>

</body>
</html>
