<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Pokémon Antica</title>
    <style>
        /* Schermo intero e sfondo suggestivo */
        body {
            background: radial-gradient(circle at center, #2b231d 0%, #120e0b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Contenitore principale della carta */
        .pokemon-card {
            width: 380px;
            height: 532px;
            background: 
                radial-gradient(circle at center, rgba(245, 230, 205, 0.9) 0%, rgba(196, 164, 124, 0.95) 100%);
            border-radius: 20px;
            border: 14px solid #5c3d29; 
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(70, 45, 25, 0.7),
                inset 0 0 10px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Area interna della carta */
        .card-inner-frame {
            background: linear-gradient(135deg, #e6d3b3 0%, #cfb58c 100%);
            border: 4px solid #8c6b48;
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
            z-index: 1;
            position: relative;
        }

        /* --- Area del Titolo (Con glifi Unown Vettoriali) --- */
        .title-container {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 72%;
            height: 52px;
            background: linear-gradient(to bottom, #4d3825, #2a1f15);
            border: 3px solid #1a130d;
            border-radius: 10px 10px 30px 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 
                        2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            padding-left: 10px;
            box-sizing: border-box;
            z-index: 2;
        }

        .unown-svg-title {
            height: 32px;
            width: auto;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.9));
        }

        /* --- Area Rossa: Immagine Pokémon (Placeholder) --- */
        .card-image-box {
            position: absolute;
            top: 78px;
            left: 12px;
            right: 12px;
            height: 250px;
            background: linear-gradient(135deg, #2b231d 0%, #1a130d 100%);
            border: 4px solid #5c3d29;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8),
                        0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-image-box span {
            color: #8c6b48;
            font-family: 'Georgia', serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            padding: 10px;
        }

        /* --- Area Verde: Testo Descrittivo --- */
        .card-description-box {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            height: 110px;
            background: linear-gradient(to bottom, #f4e8d1, #dcc4a0);
            border: 3px solid #7a5c3e;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(122, 92, 62, 0.3),
                        0 2px 4px rgba(0,0,0,0.2);
            padding: 10px 12px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-description-text {
            font-family: 'Georgia', serif;
            font-size: 12px;
            color: #3d2817;
            text-align: center;
            line-height: 1.4;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="pokemon-card">
        <div class="card-inner-frame">
            
            <div class="title-container">
                <svg class="unown-svg-title" viewBox="0 0 320 50" xmlns="http://www.w3.org/2000/svg">
                    <g fill="#d1b280" stroke="#1a130d" stroke-width="2">
                        <circle cx="20" cy="25" r="14"/><circle cx="20" cy="25" r="5" fill="#1a130d"/><path d="M18 6v-4h4v4z" fill="#d1b280"/>
                        <circle cx="55" cy="25" r="14"/><circle cx="55" cy="25" r="5" fill="#1a130d"/><path d="M53 6v-4h4v4z" fill="#d1b280"/><path d="M53 44v4h4v-4z" fill="#d1b280"/>
                        <circle cx="90" cy="25" r="14"/><circle cx="90" cy="25" r="5" fill="#1a130d"/><path d="M88 6v-4h4v4z" fill="#d1b280"/><path d="M71 23h-4v4h4z" fill="#d1b280"/>
                        <circle cx="125" cy="25" r="14"/><circle cx="125" cy="25" r="5" fill="#1a130d"/><path d="M123 6v-4h4v4z" fill="#d1b280"/><path d="M142 23h4v4h-4z" fill="#d1b280"/>
                        
                        <circle cx="175" cy="25" r="14"/><circle cx="175" cy="25" r="5" fill="#1a130d"/><path d="M173 6v-4h4v4z" fill="#d1b280"/>
                        <circle cx="210" cy="25" r="14"/><circle cx="210" cy="25" r="5" fill="#1a130d"/><path d="M208 6v-4h4v4z" fill="#d1b280"/><path d="M208 44v4h4v-4z" fill="#d1b280"/>
                        <circle cx="245" cy="25" r="14"/><circle cx="245" cy="25" r="5" fill="#1a130d"/><path d="M243 6v-4h4v4z" fill="#d1b280"/>
                        <circle cx="280" cy="25" r="14"/><circle cx="280" cy="25" r="5" fill="#1a130d"/><path d="M278 6v-4h4v4z" fill="#d1b280"/><path d="M297 23h4v4h-4z" fill="#d1b280"/>
                    </g>
                    <text x="15" y="31" font-family="monospace" font-size="14" font-weight="bold" fill="#2a1f15" opacity="0">NOME POKEMON</text>
                </svg>
            </div>
            
            <div class="card-image-box">
                <span>[ Inserisci qui la tua immagine ]</span>
            </div>

            <div class="card-description-box">
                <p class="card-description-text">
                    "Ritrovata tra le rovine di un tempio dimenticato. Emana una strana energia primordiale ogni volta che viene estratta dal mazzo."
                </p>
            </div>
            
        </div>
    </div>

</body>
</html>
