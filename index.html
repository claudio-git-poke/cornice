<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia Carta Pokémon</title>
    <style>
        body {
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Struttura principale della carta */
        .pokemon-card {
            width: 350px;
            height: 490px;
            background-color: #f8d030; /* Giallo classico stile retro Pokémon */
            border-radius: 20px;
            /* Spessore esterno tramite bordi multipli e ombre */
            border: 12px solid #1a1a1a; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5),
                        inset 0 0 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Area interna pronta per i futuri contenuti */
        .card-inner-frame {
            background-color: #ffffff;
            border: 4px solid #c0c0c0; /* Cornice interna argentata */
            border-radius: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="pokemon-card">
        <div class="card-inner-frame">
            </div>
    </div>

</body>
</html>
