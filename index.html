<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Pokémon Antica</title>
    <style>
        /* Schermo intero e sfondo suggestivo */
        body {
            background: radial-gradient(circle, #2b231d 0%, #120e0b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Struttura principale della carta (Stile Antico/Rovinato) */
        .pokemon-card {
            width: 380px;
            height: 532px;
            /* Sfondo pergamena con texture e sfumature di usura */
            background: 
                radial-gradient(circle, rgba(245, 230, 205, 0.8) 0%, rgba(196, 164, 124, 0.9) 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 4px);
            border-radius: 20px;
            
            /* Bordo spesso e irregolare, stile metallo/pietra antica ossidata */
            border: 14px solid #3d2817; 
            
            /* Effetti di usura: ombre profonde, usura sui bordi e graffi interni */
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(70, 45, 25, 0.7),
                inset 0 0 10px rgba(0, 0, 0, 0.9);
            
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }

        /* Effetto "carta logorata" agli angoli con sfumature scure */
        .pokemon-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 10px;
            box-shadow: inset 0 0 25px rgba(40, 25, 10, 0.6);
            pointer-events: none;
        }

        /* Area interna per i contenuti della carta */
        .card-inner-frame {
            background: linear-gradient(135deg, #e6d3b3 0%, #cfb58c 100%);
            border: 4px solid #6b4d32; /* Cornice interna in legno/bronzo antico */
            border-radius: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="pokemon-card">
        <div class="card-inner-frame">
            </div>
